name: Deploy site

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Build the site (bakes the hosted service URL, when configured)
        run: npm run build
        env:
          NEXT_PUBLIC_SERVICE_URL: ${{ vars.NEXT_PUBLIC_SERVICE_URL }}
      - name: Verify content-driven modules
        run: |
          node scripts/bite-check.mjs
          node scripts/season-check.mjs
          node scripts/ask-check.mjs
          node scripts/chicago-check.mjs
          node scripts/art-export.mjs --check
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
